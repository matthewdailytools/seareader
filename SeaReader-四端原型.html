<body><div class="demo"><strong>SeaReader · 交互原型</strong><div id="platforms" class="row" aria-label="预览平台"></div><button id="wire" aria-pressed="false">线稿</button></div><div id="app" class="shell"></div>
<script>
const books=[
 {title:'海边手记',format:'EPUB',chapters:['清晨的海岸','潮汐与灯塔','沿岸拾贝'],text:['清晨的海岸很安静。海风穿过防波堤，把远处灯塔的光吹进薄雾。沿着潮线走，可以看到一夜之间重新排列的石子。','潮水升起时，灯塔的影子变短。渔船陆续离港，海面留下几道相互交错的航迹。','午后的潮间带露出大片礁石。孩子们在湿润的沙面上寻找贝壳。']},
 {title:'潮汐观测记录',format:'PDF',chapters:['观测摘要','扫描记录','潮位结论'],text:['观测摘要记录了三个测站的潮高变化。','测站 B  ·  06:00  ·  潮高 1.42 m','结论：观测窗口内出现两个潮位高峰。'],scan:true},
 {title:'阅读清单',format:'TXT',chapters:['清单','待补充'],text:['本周计划：阅读两篇文章，整理一份读书笔记。','下一次更新：补充资料来源与书签。']}
];
const read=(key, fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};

const feeds={
 rss:{name:'海岸书讯',type:'RSS 2.0',items:['tide','web','broken']},
 opds:{name:'开放书架',type:'OPDS 1.2',folders:{文学:{散文:['shore']},自然:{海洋:['tide']}}},
 empty:{name:'空白书讯',type:'RSS 2.0',items:[]},
 offline:{name:'刷新失败样例',type:'RSS 2.0',items:['tide']}
};
const items={
 tide:{name:'海岸观测资料',versions:['tidePDF']},
 shore:{name:'海风来信',versions:['shoreEPUB','shorePDF','shoreTXT']},
 web:{name:'海岸书讯原文',url:'https://www.gutenberg.org/'},
 broken:{name:'下载失败演示',versions:['brokenTXT']}
};
const versions={tidePDF:['tide','PDF','420 KB',1],shoreEPUB:['shore','EPUB','184 KB',0],shorePDF:['shore','PDF','310 KB',0],shoreTXT:['shore','TXT','12 KB',0],brokenTXT:['broken','TXT','未知',2]};
const stored=read('sea-sources',{feeds:[],jobs:{}});
books.push(...read('sea-library',[]));
for(const job of Object.values(stored.jobs))if(['等待','进行中'].includes(job.status)){job.status='已取消';job.attempts=Math.max(0,job.attempts-1);}
const source={view:'library',settings:false,feed:'',folder:[],item:'',add:false,address:'',preview:'',temp:null,...stored};
const timers=new Map();
const saveSources=()=>save('sea-sources',{feeds:source.feeds,jobs:source.jobs});
const saveBooks=()=>save('sea-library',books.slice(3));
const address=id=>'https://demo.seareader.test/'+id+'.xml';
const existing=id=>books.findIndex(book=>book.resourceId===id);
function sampleBook(id){
 const [item,format,,index]=versions[id];
 return {...books[index],title:items[item].name,format,resourceId:id};
}
function notice(message){state.message=message;render();}
function primaryNav(){
 return '<nav class="main-nav" aria-label="主导航">'+[['library','书库'],['subscriptions','订阅'],['downloads','下载']].map(([id,label])=>button(label,'nav:'+id,'aria-current="'+(source.view===id?'page':'false')+'"')).join('')+'</nav>';
}
function resourceActions(id){
 const job=source.jobs[id];
 const index=existing(id);
 const download=!job||['失败','已取消'].includes(job.status)?button(job?.status==='失败'?'重试下载':'下载','queue:'+id):'<small>'+({完成:'已下载',等待:'等待下载',进行中:'下载中'}[job.status])+'</small>';
 return '<div class="row">'+(index>=0?button('打开已有书籍','open:'+index,'class="primary"'):button('打开','resource-open:'+id,'class="primary"'))+download+(index<0?button('导入书库','acquire:'+id):'<small>已入库</small>')+'</div>';
}
function itemList(ids){
 return ids.length?ids.map(id=>'<article class="card"><h3>'+items[id].name+'</h3><p class="muted">'+(items[id].versions?.map(v=>versions[v][1]).join(' · ')||'来源网页')+'</p>'+button('查看详情','item:'+id)+'</article>').join(''):'<p class="card">暂无书籍更新</p>';
}
function feedDetail(){
 const feed=feeds[source.feed];
 const item=items[source.item];
 const breadcrumb='<p class="muted">'+[feed.name,...source.folder].join(' / ')+'</p>';
 if(item)return breadcrumb+'<h2>'+item.name+'</h2>'+(item.url?'<a href="'+item.url+'" target="_blank" rel="noopener noreferrer">打开来源网页</a>':item.versions.map(id=>'<article class="card"><h3>'+versions[id][1]+'</h3><p class="muted">'+versions[id][2]+'</p>'+resourceActions(id)+'</article>').join(''));
 const node=feed.items??source.folder.reduce((folder,key)=>folder[key],feed.folders);
 return '<div class="row"><h2 class="spacer">'+feed.name+'</h2>'+button('刷新来源','refresh-feed')+button('取消订阅','unsubscribe')+'</div>'+breadcrumb+
 (Array.isArray(node)?itemList(node):Object.keys(node).map(key=>'<p>'+button(key+' ›','folder:'+key)+'</p>').join(''));
}
function subscriptions(){
 const list=source.feeds.map(id=>'<article class="card"><h3>'+feeds[id].name+'</h3><p class="muted">'+feeds[id].type+'</p>'+button('浏览书源','feed:'+id)+'</article>').join('');
 if(source.feed)return '<main><div class="row">'+button('‹ 返回','source-back')+'<h1>订阅</h1></div><div class="source-split"><div class="source-list">'+list+'</div><section>'+feedDetail()+'</section></div></main>';
 const form=source.add?'<section class="card"><label>订阅地址<input id="feed-url" type="url" value="'+escapeHTML(source.address)+'" placeholder="https://…"></label><div class="row">'+button('预览','preview-feed','class="primary"')+button('取消','source-back')+'</div><p class="muted">原型仅支持内置样例，选择样例可填入地址。</p><div class="row">'+Object.keys(feeds).map(id=>button(feeds[id].name,'sample:'+id)).join('')+'</div>'+(source.preview?'<div class="card"><h3>'+feeds[source.preview].name+'</h3><p>'+feeds[source.preview].type+'</p>'+button(source.feeds.includes(source.preview)?'打开已订阅来源':'确认订阅','subscribe','class="primary"')+'</div>':'')+'</section>':'';
 return '<main><div class="row"><h1 class="spacer">订阅</h1>'+button('添加订阅','add','class="primary"')+'</div>'+form+(list||'<p class="card">添加 RSS 或 OPDS 地址以浏览书籍资源。</p>')+'</main>';
}
function linkDownload(){
 const server='http://127.0.0.1:18765';
 if(location.origin!==server)return '<section class="card"><h2>链接下载</h2><p>支持 HTTP、HTTPS 和 FTP。请从本机下载助手打开原型。</p><p><code>python seareader_server.py</code></p><a href="'+server+'/" target="_blank" rel="noopener noreferrer">打开本机下载助手</a></section>';
 return '<section class="card"><h2>链接下载</h2><form id="link-download" action="/download" method="post" target="_blank" rel="noopener"><label for="download-url">文件链接</label><div class="row"><input class="spacer" id="download-url" name="url" type="url" required placeholder="https://… 或 ftp://…"><button class="primary" type="submit">下载文件</button></div><p class="muted">文件下载到浏览器的下载目录。下载后可从书库导入 EPUB、PDF 或 TXT。</p><p id="link-status" role="status"></p></form></section>';
}
function downloads(){
 return '<main><h1>下载</h1>'+linkDownload()+(Object.entries(source.jobs).map(([id,job])=>{
  const item=sampleBook(id);
  const controls=job.status==='完成'?resourceActions(id)+button('删除下载','remove-job:'+id):['等待','进行中'].includes(job.status)?button('取消下载','stop-job:'+id):button(job.status==='失败'?'重试':'重新下载','queue:'+id);
  return '<article class="card"><h3>'+item.title+'</h3><p>'+item.format+' · '+job.status+'</p>'+(job.status==='进行中'?'<progress aria-label="下载进度"></progress>':'')+(job.status==='失败'?'<p>模拟连接中断。重试可继续。</p>':'')+controls+'</article>';
 }).join('')||'<p class="card">从订阅中的书籍详情开始下载。</p>')+'</main>';
}
function importResource(id){
 const index=existing(id);
 if(index>=0){openBook(index);return;}
 const newIndex=books.push(sampleBook(id))-1;
 saveBooks();
 const key='temp-'+id;
 if(state.positions[key]!==undefined){
  state.positions[newIndex]=state.positions[key];delete state.positions[key];save('sea-pos',state.positions);
 }
 for(const note of state.notes)if(note.book===key)note.book=newIndex;
 save('sea-notes',state.notes);
 if(source.temp?.resourceId===id)openBook(newIndex);
 notice('已导入「'+books[newIndex].title+'」');
}
function queue(id,importAfter=false){
 const previous=source.jobs[id];
 if(previous?.status==='完成'){if(importAfter)importResource(id);return;}
 if(timers.has(id)){previous.importAfter||=importAfter;saveSources();notice('正在下载');return;}
 const job={status:'等待',attempts:(previous?.attempts??0)+1,importAfter:importAfter||Boolean(previous?.importAfter)};

function sourceAction(action,id){

 case 'settings-open':source.settings=true;render();break;

  notice(source.preview?'':'原型仅支持内置样例，请选择一个样例地址');break;

  if(!source.feeds.includes(source.preview))source.feeds.push(source.preview);
  saveSources();source.add=false;source.feed=source.preview;source.folder=[];source.item='';notice('已订阅');break;
 case 'feed':source.feed=id;source.folder=[];source.item='';render();break;
 case 'folder':source.folder.push(id);render();break;
 case 'item':source.item=id;render();break;
 case 'refresh-feed':notice(source.feed==='offline'?'刷新失败，已保留上次内容':'已刷新，暂无新书');break;
 case 'refresh-all':notice(source.feeds.includes('offline')?'部分来源刷新失败，已保留上次内容':source.feeds.length?'已刷新全部订阅':'暂无订阅');break;
 case 'unsubscribe':
  if(window.confirm('取消订阅此来源？')){source.feeds=source.feeds.filter(key=>key!==source.feed);source.feed='';source.item='';source.folder=[];saveSources();notice('已取消订阅');}break;

  resetImage();state.focus=false;source.temp=sampleBook(id);state.book='temp-'+id;state.panel='';state.zoom=1;state.previous=null;state.selection='';state.picture='';state.result='';render();break;
 case 'queue':queue(id);break;
 case 'acquire':if(existing(id)>=0)openBook(existing(id));else queue(id,true);break;
 case 'stop-job':{
  clearTimeout(timers.get(id));timers.delete(id);
  const job=source.jobs[id];job.status='已取消';job.attempts=Math.max(0,job.attempts-1);saveSources();notice('已取消下载');break;
 }
 case 'remove-job':delete source.jobs[id];saveSources();notice('已删除下载副本');break;

  if(window.confirm('清理全部已完成的下载副本？')){for(const [key,job] of Object.entries(source.jobs))if(job.status==='完成')delete source.jobs[key];saveSources();notice('已清理下载副本');}break;
 }
}

function startListening(b,position){

  const input=b.scan&&i===1?scanText(b,i):text;
  return [...input.matchAll(/[^。！？.!?；;]{1,180}[。！？.!?；;]*|[。！？.!?；;]+/g)].filter(match=>match[0].trim())
   .map(match=>({chapter:i,title:b.chapters[i],text:match[0],start:match.index}));
 });
 if(!parts.length){notice('没有可朗读的文字，请先识别扫描页');return;}
 let index=0,offset=0;
 if(position){
  index=parts.findIndex(part=>part.chapter===position.chapter&&part.start+part.text.length>position.offset);
  if(index<0){notice('此处没有可朗读的文字');return;}
  offset=Math.max(0,position.offset-parts[index].start);

function currentLocale(){
 if(prefs.locale==='English')return 'en';
 if(prefs.locale==='日本語')return 'ja';
 if(prefs.locale==='简体中文')return 'zh-CN';
 const system=window.navigator?.language?.toLowerCase()??'zh';
 return system.startsWith('zh')?'zh-CN':system.startsWith('ja')?'ja':'en';
}
function defaultTarget(){
 return prefs.language==='跟随界面语言'?({'zh-CN':'简体中文',en:'英语',ja:'日语'})[currentLocale()]:prefs.language;
}
function localeText(text,locale=currentLocale()){
 const key=text.trim();
 const translated=uiLabels[key]?.[locale==='en'?0:1];
 if(locale==='zh-CN')return text;
 if(translated)return text.replace(key,translated);
 const count=key.match(/^(\d+) 本书$/);
 if(count)return locale==='en'?count[1]+' books':count[1]+' 冊';
 if(key.startsWith('切换阅读方式，当前')){
  const mode=localeText(key.slice('切换阅读方式，当前'.length),locale);
  return locale==='en'?'Change reading mode. Current: '+mode:'読書モードを切り替え。現在: '+mode;
 }
 if(key.startsWith('‹ '))return '‹ '+(uiLabels[key.slice(2)]?.[locale==='en'?0:1]??(locale==='en'?'Back':'戻る'));
 return text;
}

 if(e.target.dataset.pref){const key=e.target.dataset.pref;prefs[key]=e.target.value;if(key==='language'||key==='locale')state.language=defaultTarget();save('sea-preferences',prefs);if((key==='speed'||key==='speechLanguage')&&listening.status==='playing'){resumeListening();return;}render();app.querySelector('[data-pref="'+key+'"]')?.focus();return;}
 if(e.target.id==='progress')move(+e.target.value,true);
 if(e.target.id==='listen-progress'){seekListening(Number(e.target.value));return;}
 if(e.target.id==='picture'){
  const file=e.target.files[0];
  if(state.imageUrl)URL.revokeObjectURL(state.imageUrl);
  state.picture=file?.name??'';state.imageUrl=file?URL.createObjectURL(file):'';state.result='';render();
 }
 if(e.target.id==='files'){
  const files=Array.from(e.target.files);if(!files.length)return;
  const first=books.length; for(const file of files){const format=file.name.split('.').pop().toUpperCase();if(!['EPUB','PDF','TXT'].includes(format))continue;let content='演示页面。';if(format==='TXT')try{content=await file.text()}catch{}books.push({title:file.name,format,chapters:['预览'],text:[content]});}
  saveBooks();state.filter='全部';state.search='';state.panel='';state.message='已导入 '+(books.length-first)+' 个文件';if(books.length===first+1&&prefs.afterImport==='立即打开')openBook(first);else render();
 }
});
app.addEventListener('submit',event=>{
 if(event.target.id!=='link-download')return;
 const value=document.querySelector('#download-url').value.trim();
 const status=document.querySelector('#link-status');
 try{
  const url=new URL(value);
  if(!['http:','https:','ftp:'].includes(url.protocol)||!url.hostname)throw new Error();
  status.textContent='已提交下载。请查看浏览器的下载记录或新标签页。';
 }catch{
  event.preventDefault();status.textContent='请输入有效的 HTTP、HTTPS 或 FTP 文件链接。';
 }
});
app.addEventListener('contextmenu',event=>{
 const paragraph=event.target.closest('[data-listen-chapter]');
 if(!paragraph||!book())return;
 event.preventDefault();showListenMenu(event,paragraph);
});
document.addEventListener('pointerdown',event=>{
 if(listenMenu&&!listenMenu.node.contains(event.target))closeListenMenu();
});
document.addEventListener('keydown',e=>{
 if(listenMenu){
  if(e.key==='Escape'){e.preventDefault();closeListenMenu(true);return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
   e.preventDefault();
   const buttons=[...listenMenu.node.querySelectorAll('button')];
   buttons.find(button=>button!==document.activeElement)?.focus();
   return;
  }
 }
 if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10')){
  const paragraph=e.target.closest('[data-listen-chapter]');
  if(paragraph){e.preventDefault();showListenMenu(e,paragraph);return;}
 }
 if(e.key==='Escape'){if(state.focus){state.focus=false;render()}else goBack();return}
 if(source.settings)return;
 if(e.key==='Enter'&&e.target.id==='feed-url'){sourceAction('preview-feed');return}
 if(e.target.id==='query'&&e.key==='Enter'){
  const q=e.target.value.trim().toLowerCase();
  if(!book()){state.search=q;state.panel='';render();return}
  const hits=book().chapters.map((c,i)=>q&&(c+' '+book().text[i]).toLowerCase().includes(q)?`<p>${button(escapeHTML(c),'jump:'+i)}</p>`:'').join('');
  document.querySelector('#hits').innerHTML=hits||'<p>没有匹配内容</p>';return;
 }
 if(e.target.matches('input,textarea,select'))return;
 if((book()||source.view==='library')&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();show('search');document.querySelector('#query')?.focus()}
 if(book()&&!state.panel&&e.key.toLowerCase()==='f'&&!e.ctrlKey&&!e.metaKey){state.focus=!state.focus;render();return;}
 if(book()&&!state.panel&&!isContinuous()&&prefs.keys==='开启'&&['ArrowLeft','ArrowRight'].includes(e.key))move(page()+(e.key==='ArrowLeft'?-1:1)*(prefs.direction==='从右到左'?-1:1));
});
app.addEventListener('input',event=>{
 if(event.target.id!=='progress')return;
 const output=app.querySelector('#position-label');
 const index=Number(event.target.value);
 output.textContent=(book().format==='PDF'?'第 '+(index+1)+' 页':book().chapters[index]);
});
let pointerStart=null;
app.addEventListener('pointerdown',event=>{
 if(event.button===0&&event.target.closest('#paper')&&!event.target.closest('button,a'))pointerStart={id:event.pointerId,x:event.clientX,y:event.clientY,type:event.pointerType};
});
app.addEventListener('pointercancel',()=>{pointerStart=null});
app.addEventListener('pointerup',event=>{
 const start=pointerStart;pointerStart=null;
 const paper=event.target.closest('#paper');
 if(!paper||!start||start.id!==event.pointerId||state.panel||window.getSelection()?.toString().trim())return;
 const dx=event.clientX-start.x,dy=event.clientY-start.y;
 const direction=prefs.direction==='从右到左'?-1:1;
 const paged=!isContinuous();
 if(start.type==='touch'&&paged&&Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.5){move(page()+direction*(dx<0?1:-1));return;}
 if(Math.abs(dx)>8||Math.abs(dy)>8||event.target.closest('button,a'))return;
 const rect=paper.getBoundingClientRect();
 const ratio=(event.clientX-rect.left)/rect.width;
 if(start.type==='touch'&&paged&&(ratio<.19||ratio>.81)){move(page()+direction*(ratio<.19?-1:1));return;}
 if(start.type==='touch'||event.target===paper){state.focus=!state.focus;render();}
});
if(prefs.start==='上次阅读')openBook(state.last);else render();
</script></body></html>
